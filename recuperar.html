<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambiar contraseña · Crisol</title>
<link rel="icon" href="logo.png">
<style>
  /* Los mismos colores de la app: quien llega aquí desde el correo debe
     reconocer que sigue en el mismo sitio. */
  :root {
    --fondo: #0F172A;
    --fondo-medio: #1E293B;
    --acento: #C6FF00;
    --texto: #FFFFFF;
    --texto-suave: rgba(255,255,255,.70);
    --texto-tenue: rgba(255,255,255,.54);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 30% 0%, #1E293B 0%, #0F172A 60%);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }

  .tarjeta {
    max-width: 420px;
    width: 100%;
    padding: 40px 28px 32px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(198,255,0,.22);
    border-radius: 28px;
    backdrop-filter: blur(18px);
  }

  .logo {
    display: block;
    width: 88px;
    height: 88px;
    /* El recorte redondo va en el propio archivo, no aquí: con border-radius
       sobre una imagen opaca asomaban las esquinas del ícono. */
    margin: 0 auto 22px;
  }

  .marca {
    width: 62px;
    height: 62px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(198,255,0,.14);
    border: 2px solid var(--acento);
  }

  /* El tilde se dibuja: una imagen más que cargar solo para esto sería
     desproporcionado. */
  .marca svg { width: 30px; height: 30px; stroke: var(--acento); }

  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .4px;
    margin-bottom: 10px;
  }

  p {
    color: var(--texto-suave);
    font-size: 14.5px;
    line-height: 1.6;
    margin-bottom: 14px;
  }

  .aviso {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: var(--texto-tenue);
    font-size: 12.5px;
    line-height: 1.6;
  }

  .paso {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    text-align: left;
    margin-bottom: 10px;
  }

  .num {
    flex: 0 0 20px;
    height: 20px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(198,255,0,.16);
    color: var(--acento);
    font-size: 11px;
    font-weight: 700;
  }

  .paso span { color: var(--texto-suave); font-size: 13.5px; line-height: 1.5; }

  input {
    width: 100%;
    margin-bottom: 12px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    background: rgba(255,255,255,.05);
    color: var(--texto);
    font-size: 15px;
    font-family: inherit;
  }

  input:focus { outline: none; border-color: var(--acento); }

  button {
    width: 100%;
    margin-top: 6px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: var(--acento);
    color: #0F172A;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  button:disabled { opacity: .5; cursor: default; }

  .mensaje {
    min-height: 18px;
    margin: 4px 0 6px;
    font-size: 13px;
    color: #FF5252;
  }

  .pie { margin-top: 24px; color: rgba(255,255,255,.34); font-size: 11.5px; }
</style>
</head>
<body>
  <main class="tarjeta">
    <img class="logo" src="logo.png" alt="Crisol">

    <div class="marca" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1>Cambiar tu contraseña</h1>
    <p>Escribe una contraseña nueva para tu cuenta.</p>

    <form id="formulario" style="margin-top:22px">
      <input id="clave" type="password" placeholder="Contraseña nueva"
             autocomplete="new-password" required>
      <input id="clave2" type="password" placeholder="Repítela"
             autocomplete="new-password" required>
      <p id="aviso" class="mensaje"></p>
      <button type="submit" id="boton">Guardar contraseña</button>
    </form>

    <div id="listo" style="display:none">
      <h1>Contraseña cambiada</h1>
      <p>Ya puedes entrar a la aplicación con tu contraseña nueva.</p>
      <p class="aviso">Cierra esta pestaña y vuelve a Crisol.</p>
    </div>

    <p class="pie">Crisol</p>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Estas dos claves son públicas por diseño: la protección real está en las
  // políticas de la base, no en ocultarlas.
  const URL_SUPABASE = 'https://iscedpzumovjocowbwwl.supabase.co';
  const CLAVE = 'sb_publishable_Wz-dmzQTB7U1zSOPPB8Xbg_T4S8FSIp';

  const cliente = supabase.createClient(URL_SUPABASE, CLAVE);
  const aviso = document.getElementById('aviso');
  const boton = document.getElementById('boton');

  // Supabase manda la sesión en el fragmento de la URL; la librería la toma
  // sola, pero conviene esperar a que lo haya hecho antes de dejar guardar.
  let listaParaGuardar = false;
  cliente.auth.onAuthStateChange((evento, sesion) => {
    if (sesion) listaParaGuardar = true;
  });

  document.getElementById('formulario').addEventListener('submit', async (e) => {
    e.preventDefault();
    const clave = document.getElementById('clave').value;
    const clave2 = document.getElementById('clave2').value;

    if (clave.length < 8) {
      aviso.textContent = 'La contraseña necesita al menos 8 caracteres.';
      return;
    }
    if (clave !== clave2) {
      aviso.textContent = 'Las contraseñas no coinciden.';
      return;
    }
    if (!listaParaGuardar) {
      aviso.textContent = 'El enlace caducó. Pide otro desde la aplicación.';
      return;
    }

    aviso.textContent = '';
    boton.disabled = true;
    boton.textContent = 'Guardando...';

    const { error } = await cliente.auth.updateUser({ password: clave });

    if (error) {
      aviso.textContent = 'No se pudo guardar. Pide un enlace nuevo.';
      boton.disabled = false;
      boton.textContent = 'Guardar contraseña';
      return;
    }

    document.getElementById('formulario').style.display = 'none';
    document.getElementById('listo').style.display = 'block';
  });
</script>
</body>
</html>
